{{ define "main" }}
<main class="article">
  <h1>{{ .Title }}</h1>
  {{ .Content }}

  <section class="post-list" aria-label="文章列表">
    {{ range .Pages }}
      <article class="post-card">
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        <div class="meta">{{ .Date.Format "2006-01-02" }}</div>
        <p>{{ .Description }}</p>
      </article>
    {{ end }}
  </section>
</main>
{{ end }}
